<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки расширения</title>
  <link rel="stylesheet" href="../shared/design-system.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="ds-page ds-atmosphere">
  <main class="ext-options-page">
    <span class="ds-badge">Wellbeing Monitor</span>
    <h1>Настройки расширения</h1>
    <p class="ds-subtitle ds-text-secondary">Подключение к API и идентификация сотрудника для ежедневных check-in.</p>

    <div class="ext-options-card">
      <form id="options-form" class="ext-options-form">
        <label class="ds-field">
          <span class="ds-field__label">URL API</span>
          <input type="url" id="apiBaseUrl" class="ds-input" required>
        </label>
        <label class="ds-field">
          <span class="ds-field__label">Секретный ключ компании</span>
          <input type="text" id="secretKey" class="ds-input" minlength="48" maxlength="48" required autocomplete="off">
        </label>
        <label class="ds-field">
          <span class="ds-field__label">External ID сотрудника</span>
          <input type="text" id="employeeExternalId" class="ds-input" required>
        </label>
        <label class="ds-field">
          <span class="ds-field__label">Email</span>
          <input type="email" id="employeeEmail" class="ds-input" required autocomplete="email">
          <span class="ds-field__hint">Тот же email, что в Jira/трекере — для сопоставления с задачами.</span>
        </label>
        <label class="ds-field">
          <span class="ds-field__label">Имя</span>
          <input type="text" id="employeeName" class="ds-input" required>
          <span class="ds-field__hint">Как в профиле сотрудника в компании (для отчётов и LLM).</span>
        </label>
        <label class="ds-field">
          <span class="ds-field__label">Час ежедневного напоминания (0–23)</span>
          <input type="number" id="reminderHour" class="ds-input" min="0" max="23" required>
        </label>
        <button type="submit" class="ds-btn-primary">Сохранить</button>
      </form>
      <p id="save-status" class="ds-text-muted" style="margin:0.875rem 0 0;font-size:0.8125rem;text-align:center;"></p>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
